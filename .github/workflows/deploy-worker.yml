name: Deploy workers

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      # The jam relay imports the wire protocol shared with the web app.
      - "apps/web/src/lib/jam-protocol.ts"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [drive-sync, jam]
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Wrangler 4 (the jam worker) requires Node 22+.
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      # Each worker pins its own wrangler in its lockfile. Deploying with
      # that exact install — rather than letting wrangler-action pick a
      # version of its own — keeps CI identical to what runs locally and
      # avoids peer-dependency clashes with the worker's other packages.
      # (Workers are not npm workspaces, so the repo-root install does not
      # cover them.)
      - name: Install ${{ matrix.worker }} dependencies
        run: npm ci

      - name: Deploy ${{ matrix.worker }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
